:root{--ink:#1b1f3b;--for:#ff6b4a;--forbg:#ffe3da;--fordk:#c2391c;--since:#3b82f6;--sincebg:#dde9ff;--sincedk:#1d4fb8;--sun:#ffd23f;--ok:#1f9d57;--okbg:#dff5e8;--bad:#d64545;--badbg:#fde4e4;--page:#fff8ec;--muted:#555a7a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--page);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--since);outline-offset:3px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}

/* header */
header{background:var(--ink);color:#fff;border-radius:22px;padding:18px 20px 20px;position:relative;overflow:hidden;margin-bottom:18px}
header .deco{position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--sun)}
header .book{display:inline-block;background:var(--sun);color:var(--ink);font-weight:700;font-size:13px;padding:4px 11px;border-radius:20px;position:relative}
header h1{font-size:clamp(26px,7vw,36px);font-weight:900;line-height:1.1;margin-top:10px;position:relative}
.pf,.ps{display:inline-block;padding:0 10px;border-radius:11px}
.pf{background:var(--for);transform:rotate(-3deg)}
.ps{background:var(--since);transform:rotate(2deg)}

/* menu */
.intro{font-size:16px;line-height:1.5;margin:4px 2px 16px}
.levels{display:grid;gap:14px}
.lvl{text-align:left;padding:16px 18px;display:flex;gap:14px;align-items:center;transition:transform .12s,box-shadow .12s}
.lvl:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.lvl:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.lvl .n{flex:none;width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:22px}
.lvl:nth-child(1) .n{background:var(--sun)}.lvl:nth-child(2) .n{background:#b8f2d0}.lvl:nth-child(3) .n{background:var(--sincebg)}
.lvl b{display:block;font-size:18px;font-weight:800}
.lvl small{display:block;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.rule{margin-top:18px;padding:14px 16px;font-size:15px;line-height:1.55}
.rule .k{font-weight:800}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{border:3px solid var(--ink);background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;font-weight:900;flex:none;box-shadow:3px 3px 0 var(--ink)}
.bar{flex:1;height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.cnt{font-weight:800;font-size:15px;flex:none;min-width:48px;text-align:right}
.task{font-size:15px;color:var(--muted);margin:0 2px 10px;font-weight:500}
.q{padding:22px 18px;font-size:clamp(20px,5.4vw,26px);font-weight:700;line-height:1.4;text-align:center}
.q .ctx{display:block;font-size:17px;font-weight:500;color:var(--muted);margin-bottom:4px}
.gap{display:inline-block;min-width:80px;border-bottom:4px dashed var(--ink);margin:0 4px;line-height:1.1}
.opts{display:grid;gap:12px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px;font-size:17px;font-weight:600;text-align:left;line-height:1.35;transition:transform .1s,box-shadow .1s}
.opts.two .opt{text-align:center;font-size:26px;font-weight:900;padding:16px}
.opt[data-k=for]{background:var(--forbg)}.opt[data-k=since]{background:var(--sincebg)}
.opt:not(:disabled):hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.opt:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:4px 4px 0 var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:4px 4px 0 var(--bad)}
.opt.dim{opacity:.45}

/* feedback */
.fb{margin-top:18px;padding:16px 18px;display:none}
.fb.show{display:block;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.fb.good{border-color:var(--ok);box-shadow:5px 5px 0 var(--ok)}
.fb.miss{border-color:var(--bad);box-shadow:5px 5px 0 var(--bad)}
.verdict{font-weight:900;font-size:19px;margin-bottom:10px}
.good .verdict{color:var(--ok)}.miss .verdict{color:var(--bad)}
.why{font-size:15px;line-height:1.5;background:var(--badbg);border-radius:10px;padding:8px 11px;margin-bottom:10px}
.en{font-size:19px;font-weight:600;line-height:1.55}
.ru{font-size:17px;line-height:1.5;margin-top:6px;color:#2d3252}
.ru::before{content:"RU";display:inline-block;font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;margin-right:8px;vertical-align:2px}
.kw{display:inline-block;padding:0 7px;border-radius:8px;color:#fff;font-weight:900}
.kw.for{background:var(--for)}.kw.since{background:var(--since)}
.te{font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.te.for{color:var(--fordk);text-decoration-color:var(--for)}.te.since{color:var(--sincedk);text-decoration-color:var(--since)}
.tip{margin-top:12px;font-size:15px;line-height:1.45;padding:9px 12px;border-radius:12px}
.tip.for{background:var(--forbg)}.tip.since{background:var(--sincebg)}
.next{margin-top:16px;width:100%;background:var(--sun);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:14px;font-size:19px;font-weight:900}
.next:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

/* result */
.res{padding:28px 20px;text-align:center}
.res .big{font-size:64px;font-weight:900;line-height:1}
.res .big span{color:var(--muted);font-size:34px}
.res p{font-size:18px;margin:12px 0 4px;line-height:1.45}
.res .btns{display:grid;gap:12px;margin-top:20px}
.res .btns button{border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:13px;font-size:18px;font-weight:800;background:#fff}
.res .btns button.main{background:var(--sun)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="deco"></div>
<span class="book">Super Minds 6, Unit 1</span>
<h1>Present Perfect: <span class="pf">for</span> или <span class="ps">since</span>?</h1>
</header>

<section id="menu">
<p class="intro">Выбери уровень. После каждого ответа ты увидишь перевод и подсказку, почему нужно именно <b>for</b> или <b>since</b>.</p>
<div class="levels">
<button class="card lvl" data-l="0"><span class="n">1</span><span><b>For или since?</b><small>Выбери слово к выражению времени</small></span></button>
<button class="card lvl" data-l="1"><span class="n">2</span><span><b>Вставь в предложение</b><small>Заполни пропуск: for или since</small></span></button>
<button class="card lvl" data-l="2"><span class="n">3</span><span><b>Найди правильное предложение</b><small>Прочитай ситуацию и выбери верный вариант</small></span></button>
</div>
<div class="card rule"><span class="k" style="color:var(--fordk)">for</span> + период — «сколько времени?»: for two years, for ten minutes<br><span class="k" style="color:var(--sincedk)">since</span> + точка во времени — «с какого момента?»: since 2020, since Monday</div>
</section>

<section id="quiz" hidden>
<div class="top"><button class="back" id="back" aria-label="К уровням">‹</button><div class="bar"><i id="bar"></i></div><div class="cnt" id="cnt"></div></div>
<p class="task" id="task"></p>
<div class="card q" id="q"></div>
<div class="opts" id="opts"></div>
<div class="card fb" id="fb" aria-live="polite"></div>
</section>

<section id="result" hidden>
<div class="card res">
<div class="big" id="score"></div>
<p id="msg"></p>
<div class="btns"><button class="main" id="again">Пройти ещё раз</button><button id="tomenu">К уровням</button></div>
</div>
</section>
</div>

<script>
/* Разметка: [for]/[since] — ключевое слово, {…} — выражение времени (и его перевод) */
const L1 = [
 {k:"for",t:"two weeks",ru:"{уже две недели}"},
 {k:"since",t:"2019",ru:"{с 2019 года}"},
 {k:"since",t:"last Monday",ru:"{с прошлого понедельника}"},
 {k:"for",t:"ten minutes",ru:"{уже десять минут}"},
 {k:"since",t:"my birthday",ru:"{с моего дня рождения}"},
 {k:"for",t:"three months",ru:"{уже три месяца}"},
 {k:"since",t:"this morning",ru:"{с сегодняшнего утра}"},
 {k:"for",t:"a long time",ru:"{уже долгое время}"},
 {k:"since",t:"September",ru:"{с сентября}"},
 {k:"for",t:"half an hour",ru:"{уже полчаса}"},
 {k:"since",t:"I was six",ru:"{с тех пор, как мне было шесть}"},
 {k:"for",t:"five years",ru:"{уже пять лет}"},
 {k:"since",t:"last summer",ru:"{с прошлого лета}"},
 {k:"for",t:"ages",ru:"{уже целую вечность}"}
];
const L2 = [
 {en:"I've known my best friend [for] {five years}.",ru:"Я знаю своего лучшего друга {уже пять лет}."},
 {en:"We've lived in this flat [since] {2018}.",ru:"Мы живём в этой квартире {с 2018 года}."},
 {en:"Bruce has been in the Caribbean [for] {six months}.",ru:"Брюс находится на Карибах {уже шесть месяцев}."},
 {en:"I've loved pirates [since] {I was ten}.",ru:"Я люблю пиратов {с тех пор, как мне было десять}."},
 {en:"She has had her cat [since] {her last birthday}.",ru:"У неё есть кошка {с её прошлого дня рождения}."},
 {en:"They've played football [for] {two hours}.",ru:"Они играют в футбол {уже два часа}."},
 {en:"He hasn't eaten anything [since] {breakfast}.",ru:"Он ничего не ел {с завтрака}."},
 {en:"We've studied English [for] {a long time}.",ru:"Мы изучаем английский {уже долгое время}."},
 {en:"My dad has worked at this school [since] {2015}.",ru:"Мой папа работает в этой школе {с 2015 года}."},
 {en:"I haven't seen Tom [since] {last Friday}.",ru:"Я не видел Тома {с прошлой пятницы}."},
 {en:"The pirates have been on the island [for] {three weeks}.",ru:"Пираты находятся на острове {уже три недели}."},
 {en:"Jack has been an actor [for] {ten years}.",ru:"Джек работает актёром {уже десять лет}."},
 {en:"It has rained [since] {this morning}.",ru:"Дождь идёт {с самого утра}."}
];
const PS = "Здесь Present Simple. Если действие началось в прошлом и продолжается сейчас, с for / since нужен Present Perfect: have / has + V3.";
const L3 = [
 {ctx:"Mia moved to London in 2020.",ru:"Мия живёт в Лондоне {с 2020 года}.",opts:[
  {t:"Mia has lived in London [since] {2020}.",ok:1},
  {t:"Mia has lived in London for 2020.",why:"2020 — это точка во времени, а не период. С точкой нужен since."},
  {t:"Mia lives in London since 2020.",why:PS}]},
 {ctx:"Leo got his dog three years ago.",ru:"У Лео есть собака {уже три года}.",opts:[
  {t:"Leo has had his dog [for] {three years}.",ok:1},
  {t:"Leo has had his dog since three years.",why:"Три года — это период («сколько времени?»). С периодом нужен for."},
  {t:"Leo has his dog for three years.",why:PS}]},
 {ctx:"Bruce arrived in the Caribbean six months ago.",ru:"Брюс находится на Карибах {уже шесть месяцев}.",opts:[
  {t:"Bruce has been in the Caribbean since six months.",why:"Шесть месяцев — это период. С периодом нужен for."},
  {t:"Bruce has been in the Caribbean [for] {six months}.",ok:1},
  {t:"Bruce is in the Caribbean for six months.",why:PS}]},
 {ctx:"Anna started learning French in September.",ru:"Анна учит французский {с сентября}.",opts:[
  {t:"Anna learns French since September.",why:PS},
  {t:"Anna has learned French for September.",why:"Сентябрь — это точка, с которой всё началось. С точкой нужен since."},
  {t:"Anna has learned French [since] {September}.",ok:1}]},
 {ctx:"We met Jack ten years ago.",ru:"Мы знаем Джека {уже десять лет}.",opts:[
  {t:"We've known Jack [for] {ten years}.",ok:1},
  {t:"We know Jack for ten years.",why:PS},
  {t:"We've known Jack since ten years.",why:"Десять лет — это период. С периодом нужен for."}]},
 {ctx:"Kate got her phone on her birthday.",ru:"У Кейт есть телефон {с её дня рождения}.",opts:[
  {t:"Kate has had her phone for her birthday.",why:"День рождения — это точка во времени. С точкой нужен since."},
  {t:"Kate has had her phone [since] {her birthday}.",ok:1},
  {t:"Kate has her phone since her birthday.",why:PS}]},
 {ctx:"The pirates arrived on the island two weeks ago.",ru:"Пираты находятся на острове {уже две недели}.",opts:[
  {t:"The pirates are on the island for two weeks.",why:PS},
  {t:"The pirates have been on the island since two weeks.",why:"Две недели — это период. С периодом нужен for."},
  {t:"The pirates have been on the island [for] {two weeks}.",ok:1}]},
 {ctx:"Sam started playing the piano when he was five.",ru:"Сэм играет на пианино {с тех пор, как ему было пять}.",opts:[
  {t:"Sam has played the piano [since] {he was five}.",ok:1},
  {t:"Sam has played the piano for he was five.",why:"«He was five» — это момент в прошлом, с которого всё началось. С точкой нужен since."},
  {t:"Sam plays the piano since he was five.",why:PS}]}
];
const LEVELS=[
 {task:"Выбери for или since",items:L1},
 {task:"Вставь for или since",items:L2},
 {task:"Прочитай ситуацию и выбери правильное предложение",items:L3}
];

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s,k){
  return esc(s).replace(/\[(for|since)\]/gi,(m,w)=>`<span class="kw ${w.toLowerCase()}">${w}</span>`)
               .replace(/\{([^}]*)\}/g,(m,x)=>`<span class="te ${k}">${x}</span>`);
}
const plain=s=>s.replace(/\[(for|since)\]/gi,"$1").replace(/[{}]/g,"");
const kOf=s=>(s.match(/\[(for|since)\]/i)||[])[1].toLowerCase();
function tip(k,expr){
  return k==="for"
   ? `<div class="tip for"><b>for</b> + период: <b>${esc(expr)}</b>. Отвечает на вопрос «сколько времени?»</div>`
   : `<div class="tip since"><b>since</b> + точка во времени: <b>${esc(expr)}</b>. Отвечает на вопрос «с какого момента?»</div>`;
}
const exprOf=s=>(s.match(/\{([^}]*)\}/)||[])[1]||"";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let lv=0,list=[],i=0,score=0;
function show(id){for(const s of ["menu","quiz","result"])$(s).hidden=s!==id;window.scrollTo(0,0)}
function start(l){lv=l;list=shuffle(LEVELS[l].items);i=0;score=0;show("quiz");render()}

function render(){
  const it=list[i],n=list.length;
  $("cnt").textContent=`${i+1}/${n}`;
  $("bar").style.width=(i/n*100)+"%";
  $("task").textContent=LEVELS[lv].task;
  const fb=$("fb");fb.className="card fb";fb.innerHTML="";
  const o=$("opts");o.innerHTML="";
  if(lv===2){
    o.className="opts";
    $("q").innerHTML=`<span class="ctx">Ситуация</span>${esc(it.ctx)}`;
    shuffle(it.opts).forEach(op=>{
      const b=document.createElement("button");b.className="opt";b.textContent=plain(op.t);
      b.onclick=()=>answer(b,op);o.appendChild(b);
    });
  }else{
    o.className="opts two";
    const q = lv===0 ? `<span class="gap">&nbsp;</span> ${esc(it.t)}`
                     : esc(plain(it.en)).replace(/\b(for|since)\b(?![^<]*>)/i,'<span class="gap">&nbsp;</span>');
    $("q").innerHTML=q;
    ["for","since"].forEach(w=>{
      const b=document.createElement("button");b.className="opt";b.dataset.k=w;b.textContent=w;
      b.onclick=()=>answer(b,w);o.appendChild(b);
    });
  }
}

function answer(btn,choice){
  const it=list[i];
  let ok,k,en,ru,expr,why="";
  const btns=[...$("opts").children];
  btns.forEach(b=>b.disabled=true);
  if(lv===2){
    const right=it.opts.find(x=>x.ok);
    ok=!!choice.ok;k=kOf(right.t);en=right.t;ru=it.ru;expr=exprOf(right.t);
    if(!ok)why=choice.why;
    btns.forEach(b=>{if(b.textContent===plain(right.t))b.classList.add("right");else if(b!==btn)b.classList.add("dim")});
  }else{
    k=lv===0?it.k:kOf(it.en);ok=choice===k;
    en=lv===0?`[${k}] {${it.t}}`:it.en;ru=it.ru;expr=lv===0?it.t:exprOf(it.en);
    btns.forEach(b=>{if(b.dataset.k===k)b.classList.add("right")});
    $("q").innerHTML=hl(en,k);
  }
  if(!ok)btn.classList.add("wrong");else score++;
  const fb=$("fb");
  fb.className="card fb show "+(ok?"good":"miss");
  const last=i===list.length-1;
  fb.innerHTML=`<div class="verdict">${ok?"Правильно!":"Не совсем. Правильно: "+k}</div>`+
    (why?`<div class="why">${esc(why)}</div>`:"")+
    `<div class="en">${hl(en,k)}</div><div class="ru">${hl(ru,k)}</div>`+tip(k,expr)+
    `<button class="next" id="next">${last?"Посмотреть результат":"Дальше"}</button>`;
  $("bar").style.width=((i+1)/list.length*100)+"%";
  const nx=$("next");nx.onclick=next;nx.focus({preventScroll:true});
  fb.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}
function next(){i++;if(i<list.length)render();else finish()}
function finish(){
  const n=list.length,p=score/n;
  $("score").innerHTML=`${score}<span>/${n}</span>`;
  $("msg").textContent=p===1?"Без единой ошибки! Ты отлично понимаешь разницу между for и since."
    :p>=.75?"Очень хорошо! Пройди ещё раз, чтобы закрепить."
    :p>=.5?"Неплохо. Перечитай подсказки: for — сколько времени, since — с какого момента."
    :"Попробуй ещё раз и обращай внимание на подсказки после каждого ответа.";
  show("result");
}
document.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>start(+b.dataset.l));
$("back").onclick=()=>show("menu");
$("again").onclick=()=>start(lv);
$("tomenu").onclick=()=>show("menu");
</script>
</body>
</html>
